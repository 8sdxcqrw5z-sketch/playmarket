<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bottleneck Portfolio</title>
  <style>
    :root {
      --bg:         #0f1117;
      --surface:    #1a1d27;
      --border:     #2a2d3a;
      --text:       #d8dae8;
      --muted:      #7b7e97;
      --heading:    #f0f2ff;
      --accent:     #5b8dee;
      --code-bg:    #141720;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg:      #f6f7fb;
        --surface: #ffffff;
        --border:  #dde0ee;
        --text:    #1e2030;
        --muted:   #5a5e78;
        --heading: #0f1117;
        --accent:  #2563eb;
        --code-bg: #eef0f8;
      }
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      font-size: 17px;
      line-height: 1.65;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
      padding: 0 16px;
    }

    /* ── Header ── */
    header {
      border-bottom: 1px solid var(--border);
      padding: 18px 0;
    }

    header .inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    header h1 {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--heading);
      letter-spacing: -0.01em;
    }

    /* ── Analysis list ── */
    .list {
      list-style: none;
    }

    .list-item {
      border-bottom: 1px solid var(--border);
    }

    .list-link {
      display: block;
      padding: 20px 0;
      text-decoration: none;
      color: inherit;
    }

    .list-link:hover .item-title,
    .list-link:focus .item-title {
      color: var(--accent);
    }

    .item-date {
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }

    .item-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--heading);
      margin-bottom: 5px;
      transition: color 0.1s;
    }

    .item-preview {
      font-size: 0.88rem;
      color: var(--muted);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* ── Single analysis ── */
    .back {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--accent);
      text-decoration: none;
      font-size: 0.9rem;
      padding: 14px 0;
      min-height: 44px;
    }

    .back:hover { text-decoration: underline; }

    .analysis-date {
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }

    /* ── Markdown body ── */
    .md {
      padding: 20px 0 72px;
    }

    .md h1, .md h2, .md h3, .md h4 {
      color: var(--heading);
      font-weight: 600;
      letter-spacing: -0.01em;
      line-height: 1.3;
      margin: 1.75em 0 0.55em;
    }

    .md h1 { font-size: 1.65rem; margin-top: 0.25em; }
    .md h2 { font-size: 1.2rem;  border-bottom: 1px solid var(--border); padding-bottom: 0.25em; }
    .md h3 { font-size: 1rem; }
    .md h4 { font-size: 0.95rem; }

    .md p  { margin: 0.9em 0; }

    .md ul, .md ol { margin: 0.9em 0; padding-left: 1.6em; }
    .md li { margin: 0.3em 0; }

    .md li > input[type="checkbox"] { margin-right: 0.4em; }

    .md strong { color: var(--heading); font-weight: 600; }
    .md em     { font-style: italic; }
    .md a      { color: var(--accent); }

    .md blockquote {
      border-left: 3px solid var(--border);
      margin: 1.2em 0;
      padding: 0.4em 1em;
      color: var(--muted);
    }

    .md code {
      font-family: "SF Mono", "Fira Code", Consolas, "Courier New", monospace;
      font-size: 0.84em;
      background: var(--code-bg);
      padding: 0.15em 0.35em;
      border-radius: 3px;
    }

    .md pre {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 14px 16px;
      overflow-x: auto;
      margin: 1.2em 0;
      -webkit-overflow-scrolling: touch;
    }

    .md pre code {
      background: none;
      padding: 0;
      font-size: 0.87rem;
      line-height: 1.55;
    }

    .md hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 2em 0;
    }

    /* Tables scroll inside container, never bleed */
    .md .tbl-wrap {
      overflow-x: auto;
      margin: 1.2em 0;
      -webkit-overflow-scrolling: touch;
    }

    .md table { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
    .md th { text-align: left; font-weight: 600; color: var(--heading); border-bottom: 2px solid var(--border); padding: 8px 12px; }
    .md td { padding: 8px 12px; border-bottom: 1px solid var(--border); }

    /* ── Empty / 404 ── */
    .empty, .not-found {
      padding: 56px 0;
      text-align: center;
      color: var(--muted);
    }

    .not-found h2 { color: var(--heading); margin-bottom: 10px; }

    .home-link {
      color: var(--accent);
      text-decoration: none;
      font-size: 0.95rem;
    }

    .home-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
<div class="container">
  <header>
    <div class="inner">
      <h1>Bottleneck Portfolio</h1>
    </div>
  </header>
  <div id="app"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<script>
// =============================================================================
// ANALYSES
//
// To add a new analysis:
//   1. Copy one entry below
//   2. Set date (YYYY-MM-DD), slug (letters/numbers/hyphens only), and markdown
//   3. Paste it at the TOP of the array so it appears first
//   4. Save and re-upload bottleneck-portfolio.html to Netlify
//
// The title is pulled automatically from the first # heading in your markdown.
// To edit or delete, just change or remove the entry and re-upload.
// =============================================================================

const ANALYSES = [

  {
    date: "2026-05-13",
    slug: "example-nvidia-bottleneck",
    markdown: `# NVIDIA: The AI Training Bottleneck

NVIDIA sits at the single chokepoint every major AI lab must pass through. Until a credible alternative exists at scale, this moat compounds.

## Bottleneck Map

| Layer | Who Controls | Moat |
|-------|-------------|------|
| GPU silicon (H100/H200/B200) | NVIDIA | Very High |
| CUDA software ecosystem | NVIDIA | Very High |
| HBM memory supply | SK Hynix / Micron | Medium |
| CoWoS advanced packaging | TSMC | High |
| NVLink interconnect | NVIDIA | High |

## Thesis

Every training cluster at scale runs on NVIDIA. Switching costs are enormous — CUDA is 15+ years of accumulated tooling, and no alternative matches H100 performance per dollar in production today. AMD MI300X is real for inference but not yet a training threat.

## Key Risks

- AMD inference wins accelerating beyond one hyperscaler
- TSMC CoWoS allocation shifting — any capacity going elsewhere compresses NVIDIA supply
- US export controls cutting off China demand faster than new markets absorb it
- Customer in-house silicon (Google TPUs, Amazon Trainium) cannibalizing at the margin

## What to Watch

- AMD MI300X design wins at tier-1 hyperscalers — specifically training, not just inference
- CoWoS capacity commitments in TSMC earnings calls
- Blackwell ramp rate vs. reported demand — any sign of push-outs is early warning
- OpenAI / xAI training cluster procurement announcements

## Verdict

WATCH. Core thesis intact through 2026. Position sizing depends on whether you believe inference displaces training spend or complements it. I think complements — but it bears watching every quarter.

---

*This is example content. Replace with your real analyses.*
`
  }

];

// =============================================================================
// Everything below is the app — no need to touch it.
// =============================================================================

// ── Routing ──────────────────────────────────────────────────────────────────

function getRoute() {
  const hash = (window.location.hash || '#/').replace(/^#/, '') || '/';
  if (hash === '/' || hash === '') return { page: 'home' };
  const m = hash.match(/^\/analysis\/([^/]+)$/);
  if (m) return { page: 'analysis', slug: m[1] };
  return { page: '404' };
}

window.addEventListener('hashchange', render);
document.addEventListener('DOMContentLoaded', render);

// ── Helpers ───────────────────────────────────────────────────────────────────

function extractTitle(md) {
  const m = md.match(/^#\s+(.+)$/m);
  return m ? m[1].trim() : 'Untitled';
}

function extractPreview(md) {
  for (const line of md.split('\n')) {
    const t = line.trim();
    if (t && !t.startsWith('#') && !t.startsWith('|') && !t.startsWith('```') && !t.startsWith('---')) {
      return t.replace(/[*_`[\]]/g, '').slice(0, 180);
    }
  }
  return '';
}

function formatDate(s) {
  const [y, m, d] = s.split('-').map(Number);
  return new Date(y, m - 1, d).toLocaleDateString('en-US', {
    year: 'numeric', month: 'long', day: 'numeric'
  });
}

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderMd(markdown) {
  marked.use({ gfm: true, breaks: false });
  const raw = marked.parse(markdown);
  const clean = DOMPurify.sanitize(raw, { USE_PROFILES: { html: true } });
  // Wrap tables for horizontal scroll
  return clean
    .replace(/<table>/g, '<div class="tbl-wrap"><table>')
    .replace(/<\/table>/g, '</table></div>');
}

// ── Views ─────────────────────────────────────────────────────────────────────

function viewHome() {
  const sorted = [...ANALYSES].sort((a, b) => b.date.localeCompare(a.date));
  if (!sorted.length) return '<div class="empty"><p>No analyses yet.</p></div>';

  const items = sorted.map(a => {
    const title   = extractTitle(a.markdown);
    const preview = extractPreview(a.markdown);
    return `
      <li class="list-item">
        <a class="list-link" href="#/analysis/${esc(a.slug)}">
          <div class="item-date">${esc(formatDate(a.date))}</div>
          <div class="item-title">${esc(title)}</div>
          ${preview ? `<div class="item-preview">${esc(preview)}</div>` : ''}
        </a>
      </li>`;
  }).join('');

  return `<ul class="list">${items}</ul>`;
}

function viewAnalysis(slug) {
  const a = ANALYSES.find(x => x.slug === slug);
  if (!a) {
    return `
      <div class="not-found">
        <h2>Analysis not found</h2>
        <p><a class="home-link" href="#/">← Back to list</a></p>
      </div>`;
  }
  return `
    <a class="back" href="#/">← Back</a>
    <div class="analysis-date">${esc(formatDate(a.date))}</div>
    <div class="md">${renderMd(a.markdown)}</div>`;
}

// ── Main render ───────────────────────────────────────────────────────────────

function render() {
  const route = getRoute();
  const app   = document.getElementById('app');

  if (route.page === 'home') {
    document.title = 'Bottleneck Portfolio';
    app.innerHTML  = viewHome();
  } else if (route.page === 'analysis') {
    const a = ANALYSES.find(x => x.slug === route.slug);
    document.title = (a ? esc(extractTitle(a.markdown)) : 'Not Found') + ' — Bottleneck Portfolio';
    app.innerHTML  = viewAnalysis(route.slug);
    window.scrollTo(0, 0);
  } else {
    document.title = 'Not Found — Bottleneck Portfolio';
    app.innerHTML  = `
      <div class="not-found">
        <h2>Page not found</h2>
        <p><a class="home-link" href="#/">← Back to list</a></p>
      </div>`;
  }
}
</script>
</body>
</html>
